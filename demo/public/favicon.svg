<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#111118"/>
  <!-- Left ledger lines (Source A - purple) -->
  <rect x="4" y="8" width="10" height="2" rx="0.5" fill="#7c3aed"/>
  <rect x="4" y="12" width="10" height="2" rx="0.5" fill="#7c3aed" opacity="0.7"/>
  <rect x="4" y="16" width="10" height="2" rx="0.5" fill="#7c3aed" opacity="0.4"/>
  <rect x="4" y="20" width="10" height="2" rx="0.5" fill="#7c3aed" opacity="0.4"/>
  <!-- Match connector line -->
  <line x1="15" y1="9" x2="17" y2="9" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="15" y1="13" x2="17" y2="13" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right ledger lines (Source B - green) -->
  <rect x="18" y="8" width="10" height="2" rx="0.5" fill="#059669"/>
  <rect x="18" y="12" width="10" height="2" rx="0.5" fill="#059669" opacity="0.7"/>
  <rect x="18" y="16" width="10" height="2" rx="0.5" fill="#dc2626" opacity="0.8"/>
  <rect x="18" y="20" width="10" height="2" rx="0.5" fill="#059669" opacity="0.4"/>
  <!-- Exception indicator (red dot on unmatched) -->
  <circle cx="27" cy="17" r="2.5" fill="#dc2626"/>
  <text x="27" y="18" text-anchor="middle" font-size="3" fill="white" font-weight="bold">!</text>
  <!-- Check mark on matched -->
  <path d="M24 10 L25.5 11.5 L28 8.5" stroke="#059669" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
